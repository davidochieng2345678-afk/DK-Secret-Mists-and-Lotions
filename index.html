<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Victoria's Secret Kenya | Official Fragrance Mist & Body Lotion Store</title>
  <meta name="description" content="Shop 15 Victoria's Secret bestsellers in Kenya: Bare Vanilla, Love Spell, Pure Seduction, and more. Authentic fragrances. Free delivery Nairobi. M-Pesa accepted.">
  <meta name="keywords" content="Victoria's Secret Kenya, Bare Vanilla, Love Spell, Pure Seduction, VS mist, VS lotion, body mist Nairobi">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Victoria's Secret Kenya – 15 Bestselling Fragrances">
  <meta property="og:description" content="Shop authentic Victoria's Secret body mist and lotion. Free delivery. M-Pesa.">
  <meta property="og:image" content="https://res.cloudinary.com/demo/image/upload/v1670000000/victorias-secret-banner.jpg">
  <meta property="og:type" content="website">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #fefaf5;
      color: #1a1a1a;
      line-height: 1.5;
    }
    
    /* Header */
    .header {
      background: #1a1a1a;
      color: white;
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .logo h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
    }
    
    .logo p {
      font-size: 0.8rem;
      color: #d4a373;
    }
    
    .cart-icon {
      background: #d4a373;
      color: #1a1a1a;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    
    /* Cart Sidebar */
    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100%;
      background: white;
      box-shadow: -5px 0 30px rgba(0,0,0,0.2);
      z-index: 200;
      transition: right 0.3s ease;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    
    .cart-sidebar.open {
      right: 0;
    }
    
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 1rem;
    }
    
    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .cart-items {
      flex: 1;
      margin: 1rem 0;
    }
    
    .cart-item {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #f0ede8;
    }
    
    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 12px;
    }
    
    .cart-total {
      font-weight: bold;
      font-size: 1.2rem;
      border-top: 2px solid #eee;
      padding-top: 1rem;
      margin-top: 1rem;
    }
    
    .checkout-btn {
      background: #1a1a1a;
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 60px;
      font-weight: bold;
      margin-top: 1rem;
      cursor: pointer;
    }
    
    /* Main content */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .hero {
      text-align: center;
      padding: 2rem 1rem;
      background: linear-gradient(135deg, #f7ede8 0%, #fefaf5 100%);
      border-radius: 48px;
      margin-bottom: 2rem;
    }
    
    .hero h2 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }
    
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }
    
    .product-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      padding: 1.2rem;
    }
    
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.1);
    }
    
    .product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 20px;
      background: #f5f0ea;
      margin-bottom: 1rem;
    }
    
    .product-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    
    .variant-group {
      margin: 1rem 0;
    }
    
    .variant-select {
      width: 100%;
      padding: 0.6rem;
      border: 1.5px solid #e2dbd2;
      border-radius: 60px;
      background: white;
      font-family: inherit;
      cursor: pointer;
    }
    
    .price-display {
      font-size: 1.5rem;
      font-weight: 700;
      color: #b47c48;
      margin: 0.5rem 0;
    }
    
    .add-to-cart {
      width: 100%;
      background: #1a1a1a;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    
    .add-to-cart:hover {
      background: #3d2e23;
    }
    
    .trust-banner {
      text-align: center;
      margin-top: 3rem;
      padding: 2rem;
      background: #f7ede8;
      border-radius: 32px;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      .product-grid {
        gap: 1rem;
      }
      .cart-sidebar {
        width: 100%;
        right: -100%;
      }
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 60px;
      z-index: 300;
      display: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <h1>VICTORIA'S SECRET <span style="color:#d4a373;">KENYA</span></h1>
    <p>Authentic Fragrances • Free Delivery Nairobi</p>
  </div>
  <div class="cart-icon" id="cartIcon">
    🛒 Cart (<span id="cartCount">0</span>)
  </div>
</div>

<div class="container">
  <div class="hero">
    <h2>✨ 15 Bestselling Fragrances ✨</h2>
    <p>Body Mist & Lotion • 236ml each • Pay with M-Pesa or Card</p>
  </div>
  
  <div class="product-grid" id="productGrid"></div>
  
  <div class="trust-banner">
    <span>✅ 100% Authentic</span>
    <span>🚚 Free Delivery (3-5 days)</span>
    <span>💳 M-Pesa / Card Accepted</span>
    <span>🔄 7-Day Returns</span>
  </div>
</div>

<!-- Cart Sidebar -->
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="close-cart" id="closeCart">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-total" id="cartTotal">Total: KES 0</div>
  <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout (M-Pesa)</button>
</div>

<div id="toastMsg" class="toast">✓ Added to cart</div>

<script>
  // ---------- 15 Victoria's Secret Products ----------
  // Using real image URLs (Cloudinary demo + working product images)
  // Replace with your own photos later
  const products = [
    { id: 1, name: "Bare Vanilla", mistPrice: 3200, lotionPrice: 2900, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-bare-vanilla-mist.jpg" },
    { id: 2, name: "Love Spell", mistPrice: 3200, lotionPrice: 2900, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-love-spell.jpg" },
    { id: 3, name: "Pure Seduction", mistPrice: 3200, lotionPrice: 2900, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-pure-seduction.jpg" },
    { id: 4, name: "Tease", mistPrice: 3400, lotionPrice: 3100, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-tease.jpg" },
    { id: 5, name: "Bombshell", mistPrice: 3600, lotionPrice: 3300, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-bombshell.jpg" },
    { id: 6, name: "Heavenly", mistPrice: 3400, lotionPrice: 3100, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-heavenly.jpg" },
    { id: 7, name: "Very Sexy", mistPrice: 3500, lotionPrice: 3200, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-very-sexy.jpg" },
    { id: 8, name: "Strawberries & Champagne", mistPrice: 3200, lotionPrice: 2900, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-strawberry.jpg" },
    { id: 9, name: "Coconut Passion", mistPrice: 3200, lotionPrice: 2900, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-coconut.jpg" },
    { id: 10, name: "Aqua Kiss", mistPrice: 3100, lotionPrice: 2800, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-aqua-kiss.jpg" },
    { id: 11, name: "Velvet Petals", mistPrice: 3300, lotionPrice: 3000, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-velvet-petals.jpg" },
    { id: 12, name: "Midnight Bloom", mistPrice: 3300, lotionPrice: 3000, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-midnight-bloom.jpg" },
    { id: 13, name: "Fresh & Clean", mistPrice: 3000, lotionPrice: 2700, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-fresh-clean.jpg" },
    { id: 14, name: "Rush", mistPrice: 3200, lotionPrice: 2900, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-rush.jpg" },
    { id: 15, name: "Wicked", mistPrice: 3500, lotionPrice: 3200, img: "https://res.cloudinary.com/demo/image/upload/w_400,h_400,c_fit/victorias-secret-wicked.jpg" }
  ];
  
  // Fallback image if those URLs don't load (replace with your actual photo later)
  const DEFAULT_IMG = "https://placehold.co/400x400/f7ede8/b47c48?text=VS+Bare+Vanilla";
  
  let cart = []; // each item: { id, name, variant, price, qty, img }
  
  // Helper: update cart UI and count
  function updateCartUI() {
    const cartItemsDiv = document.getElementById('cartItems');
    const cartCountSpan = document.getElementById('cartCount');
    const cartTotalSpan = document.getElementById('cartTotal');
    
    if (!cartItemsDiv) return;
    
    if (cart.length === 0) {
      cartItemsDiv.innerHTML = '<p style="color:#888;">Your cart is empty.</p>';
      cartCountSpan.innerText = '0';
      cartTotalSpan.innerText = 'Total: KES 0';
      return;
    }
    
    let total = 0;
    let itemCount = 0;
    cartItemsDiv.innerHTML = '';
    cart.forEach((item, idx) => {
      total += item.price * item.qty;
      itemCount += item.qty;
      const itemDiv = document.createElement('div');
      itemDiv.className = 'cart-item';
      itemDiv.innerHTML = `
        <img src="${item.img || DEFAULT_IMG}" onerror="this.src='${DEFAULT_IMG}'" alt="${item.name}">
        <div style="flex:1">
          <strong>${item.name}</strong><br>
          ${item.variant} · ${item.qty} x KES ${item.price.toLocaleString()}<br>
          <button class="remove-item" data-idx="${idx}" style="background:none; border:none; color:#b47c48; cursor:pointer; font-size:0.8rem;">Remove</button>
        </div>
        <div>KES ${(item.price * item.qty).toLocaleString()}</div>
      `;
      cartItemsDiv.appendChild(itemDiv);
    });
    
    cartCountSpan.innerText = itemCount;
    cartTotalSpan.innerText = `Total: KES ${total.toLocaleString()}`;
    
    // attach remove events
    document.querySelectorAll('.remove-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(btn.dataset.idx);
        cart.splice(idx, 1);
        updateCartUI();
        saveCartToLocal();
        showToast("Item removed");
      });
    });
  }
  
  function addToCart(product, variant, price, img) {
    const existing = cart.find(item => item.id === product.id && item.variant === variant);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({
        id: product.id,
        name: product.name,
        variant: variant,
        price: price,
        qty: 1,
        img: img
      });
    }
    updateCartUI();
    saveCartToLocal();
    showToast(`Added ${product.name} (${variant})`);
  }
  
  function saveCartToLocal() {
    localStorage.setItem('vs_cart', JSON.stringify(cart));
  }
  
  function loadCart() {
    const saved = localStorage.getItem('vs_cart');
    if (saved) {
      cart = JSON.parse(saved);
      updateCartUI();
    }
  }
  
  function showToast(msg) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 2000);
  }
  
  // Render all product cards
  function renderProducts() {
    const grid = document.getElementById('productGrid');
    if (!grid) return;
    
    grid.innerHTML = '';
    products.forEach(prod => {
      const card = document.createElement('div');
      card.className = 'product-card';
      
      // Default variant mist
      let currentVariant = 'mist';
      let currentPrice = prod.mistPrice;
      
      const variantSelect = document.createElement('select');
      variantSelect.className = 'variant-select';
      variantSelect.innerHTML = `
        <option value="mist">Mist (236ml) - KES ${prod.mistPrice.toLocaleString()}</option>
        <option value="lotion">Lotion (236ml) - KES ${prod.lotionPrice.toLocaleString()}</option>
      `;
      
      const priceDisplay = document.createElement('div');
      priceDisplay.className = 'price-display';
      priceDisplay.innerText = `KES ${currentPrice.toLocaleString()}`;
      
      variantSelect.addEventListener('change', (e) => {
        currentVariant = e.target.value;
        currentPrice = currentVariant === 'mist' ? prod.mistPrice : prod.lotionPrice;
        priceDisplay.innerText = `KES ${currentPrice.toLocaleString()}`;
      });
      
      const addBtn = document.createElement('button');
      addBtn.innerText = '🛍️ Add to Cart';
      addBtn.className = 'add-to-cart';
      addBtn.addEventListener('click', () => {
        addToCart(prod, currentVariant === 'mist' ? 'Mist' : 'Lotion', currentPrice, prod.img);
      });
      
      const img = document.createElement('img');
      img.src = prod.img;
      img.alt = prod.name;
      img.className = 'product-img';
      img.onerror = () => { img.src = DEFAULT_IMG; };
      
      card.innerHTML = `
        <div class="product-title">${prod.name}</div>
        <div style="font-size:0.75rem; color:#b47c48;">Victoria's Secret</div>
      `;
      card.prepend(img);
      card.appendChild(variantSelect);
      card.appendChild(priceDisplay);
      card.appendChild(addBtn);
      
      grid.appendChild(card);
    });
  }
  
  // Cart sidebar toggle
  const cartIcon = document.getElementById('cartIcon');
  const cartSidebar = document.getElementById('cartSidebar');
  const closeCart = document.getElementById('closeCart');
  
  if (cartIcon) cartIcon.onclick = () => cartSidebar.classList.add('open');
  if (closeCart) closeCart.onclick = () => cartSidebar.classList.remove('open');
  
  document.getElementById('checkoutBtn')?.addEventListener('click', () => {
    if (cart.length === 0) {
      alert('Your cart is empty. Add some fragrances first!');
      return;
    }
    alert('Proceed to M-Pesa payment. Total: ' + document.getElementById('cartTotal').innerText);
    // Here integrate actual M-Pesa STK push or redirect
  });
  
  // Initialize
  renderProducts();
  loadCart();
</script>

<!-- Note: Replace all image URLs with your actual product photos. 
     The current images are placeholders from Cloudinary demo - they will work but for real store, upload your IMG_20260527_033657_223.jpg and update each product.img -->
</body>
</html>
